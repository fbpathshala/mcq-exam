<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Exam</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:Arial,"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.07)}.hidden{display:none!important}.muted{color:#667085;font-size:14px}.msg{padding:11px;border-radius:9px;margin:12px 0;background:#eef3f7}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}label{display:block;font-weight:600;margin:10px 0 5px}input[type=text],input[type=tel]{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font-size:16px}button{border:0;border-radius:9px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}button:disabled{opacity:.6}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.timer{font-weight:700;background:#eef2ff;padding:10px 13px;border-radius:9px;min-width:76px;text-align:center}.q{font-weight:700;line-height:1.5;margin-bottom:12px}.opt{border:1px solid #d0d5dd;border-radius:9px;padding:11px;margin:8px 0;cursor:pointer;font-weight:400}.opt input{width:auto;margin-right:8px}.actions{display:flex;justify-content:flex-end;margin-top:16px}.loading{text-align:center}@media(max-width:600px){.wrap{padding:7px}}
</style></head>
<body><div class="wrap">
<div id="message" class="msg hidden"></div><div id="loading" class="card loading">পরীক্ষা লোড হচ্ছে...</div>
<div id="startBox" class="card hidden"><h1 id="examTitle">MCQ Exam</h1><p id="examInfo" class="muted"></p><label for="name">নাম *</label><input id="name" type="text" placeholder="আপনার নাম"><label for="facebook">Facebook নাম</label><input id="facebook" type="text" placeholder="Facebook নাম"><label for="district">জেলা</label><input id="district" type="text" placeholder="জেলার নাম"><label for="mobile">মোবাইল নম্বর</label><input id="mobile" type="tel" placeholder="মোবাইল নম্বর"><div class="actions"><button id="startBtn" type="button">পরীক্ষা শুরু করুন</button></div></div>
<div id="examBox" class="hidden"><div class="card top"><div><h2 id="runningTitle"></h2><div id="progress" class="muted"></div></div><div id="timer" class="timer">--:--</div></div><div id="questions"></div><div class="card actions"><button id="submitBtn" type="button">পরীক্ষা জমা দিন</button></div></div>
<div id="done" class="card hidden"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const SUPABASE_URL="https://ydvbnalhcnfqpxkkmywr.supabase.co",SUPABASE_KEY="sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const examId=new URLSearchParams(location.search).get("exam");let exam=null,questions=[],timerId=null,secondsLeft=0,submitted=false;const $=id=>document.getElementById(id);function safe(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function qtext(q){return q.question??q.question_text??q.text??q.questionText??""}function showMsg(t,type="error"){const e=$("message");e.textContent=t;e.className="msg "+type}
async function loadExam(){if(!examId){$("loading").classList.add("hidden");showMsg("এই পরীক্ষার লিংক সঠিক নয়। Admin Panel-এর Exam Management থেকে Copy Link ব্যবহার করুন।");return}const er=await db.from("exams").select("*").eq("id",examId).maybeSingle();if(er.error||!er.data){$("loading").classList.add("hidden");showMsg("পরীক্ষাটি পাওয়া যায়নি।");return}exam=er.data;if(exam.is_active===false){$("loading").classList.add("hidden");showMsg("এই পরীক্ষা বর্তমানে সক্রিয় নয়।");return}const qr=await db.from("questions").select("*").eq("exam_id",exam.id).order("question_order",{ascending:true});if(qr.error){$("loading").classList.add("hidden");showMsg("প্রশ্ন লোড করা যায়নি: "+qr.error.message);return}questions=qr.data||[];if(!questions.length){$("loading").classList.add("hidden");showMsg("এই পরীক্ষায় এখনো কোনো প্রশ্ন যোগ করা হয়নি।");return}$("loading").classList.add("hidden");$("examTitle").textContent=exam.title||"MCQ Exam";$("examInfo").textContent="প্রশ্ন: "+questions.length+" | সময়: "+Number(exam.duration_minutes||0)+" মিনিট";$("startBox").classList.remove("hidden")}
function render(){ $("runningTitle").textContent=exam.title||"MCQ Exam";$("progress").textContent="মোট প্রশ্ন: "+questions.length;$("questions").innerHTML=questions.map((q,i)=>`<div class="card"><div class="q">${i+1}. ${safe(qtext(q))}</div>${["a","b","c","d"].map(x=>`<label class="opt"><input type="radio" name="q_${safe(q.id)}" value="${x.toUpperCase()}"> ${safe(q["option_"+x])}</label>`).join("")}</div>`).join("")}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;$("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}function startTimer(){secondsLeft=Math.max(0,Number(exam.duration_minutes||0)*60);tick();clearInterval(timerId);if(!secondsLeft)return;timerId=setInterval(()=>{secondsLeft--;tick();if(secondsLeft<=0){clearInterval(timerId);submitExam(true)}},1000)}
function collect(){const a={};questions.forEach(q=>{const x=document.querySelector('input[name="q_'+CSS.escape(String(q.id))+'"]:checked');a[String(q.id)]=x?x.value:""});return a}
function start(){const name=$("name").value.trim();if(!name){showMsg("নাম লিখুন।");$("name").focus();return}$("startBox").classList.add("hidden");$("examBox").classList.remove("hidden");render();startTimer();scrollTo(0,0)}
async function saveResult(answers,score){const student={name:$("name").value.trim(),facebook_name:$("facebook").value.trim(),district:$("district").value.trim(),mobile:$("mobile").value.trim()};const sr=await db.from("students").insert(student).select("id").single();if(sr.error)return sr.error;const ar=await db.from("exam_attempts").insert({exam_id:exam.id,student_id:sr.data.id,score,total_questions:questions.length,submitted_at:new Date().toISOString(),answers});return ar.error||null}
async function submitExam(auto){if(submitted)return;if(!auto&&!confirm("আপনি কি পরীক্ষা জমা দিতে চান?"))return;submitted=true;clearInterval(timerId);$("submitBtn").disabled=true;const answers=collect(),marks=Number(exam.marks_per_question||1),negative=Number(exam.negative_mark||0);let score=0;questions.forEach(q=>{const a=answers[String(q.id)];if(!a)return;if(a===String(q.correct_answer||"").toUpperCase())score+=marks;else score-=negative});const error=await saveResult(answers,score);if(error){submitted=false;$("submitBtn").disabled=false;showMsg("ফলাফল সংরক্ষণ করা যায়নি: "+error.message);return}$("examBox").classList.add("hidden");$("done").classList.remove("hidden");$("done").innerHTML=`<h2>পরীক্ষা জমা হয়েছে ✅</h2><p>শিক্ষার্থী: <b>${safe($("name").value.trim())}</b></p><p>স্কোর: <b>${safe(score)}</b></p><p class="muted">আপনার পরীক্ষা সফলভাবে জমা হয়েছে।</p>`;scrollTo(0,0)}
$("startBtn").addEventListener("click",start);$("submitBtn").addEventListener("click",()=>submitExam(false));loadExam();
</script></body></html>
