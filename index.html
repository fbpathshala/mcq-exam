<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MCQ Exam</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    .header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .start-btn {
      width: 100%;
      margin-top: 22px;
      background: #2563eb;
      color: white;
    }

    .start-btn:hover {
      background: #1d4ed8;
    }

    .next-btn {
      background: #2563eb;
      color: white;
    }

    .prev-btn {
      background: #6b7280;
      color: white;
    }

    .submit-btn {
      background: #16a34a;
      color: white;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .option {
      display: block;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      padding: 13px;
      margin: 10px 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .option:hover {
      background: #eff6ff;
    }

    .option input {
      width: auto;
      margin-right: 8px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .timer {
      color: #dc2626;
    }

    .progress {
      color: #2563eb;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    .nav-buttons button {
      flex: 1;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .success {
      background: #f0fdf4;
      color: #15803d;
    }

    .result {
      text-align: center;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      color: #2563eb;
      margin: 20px 0;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 21px;
      }

      .card {
        padding: 17px;
      }

      .question {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📝 MCQ Exam</h1>
  </div>

  <div class="container">

    <!-- START PAGE -->
    <div id="startPage" class="card">

      <h2 id="examTitle">Exam</h2>

      <p>
        পরীক্ষা শুরু করার আগে নিচের তথ্যগুলো সঠিকভাবে পূরণ করুন।
      </p>

      <label for="studentName">নাম</label>
      <input
        type="text"
        id="studentName"
        placeholder="আপনার নাম লিখুন"
      >

      <label for="facebookName">
        ফেসবুক আইডি নাম
      </label>

      <input
        type="text"
        id="facebookName"
        placeholder="ফেসবুকে ব্যবহৃত নাম লিখুন"
      >

      <label for="district">
        নিজ জেলা
      </label>

      <select id="district">
        <option value="">জেলা নির্বাচন করুন</option>
        <option>ঢাকা</option>
        <option>চট্টগ্রাম</option>
        <option>কুমিল্লা</option>
        <option>ফেনী</option>
        <option>নোয়াখালী</option>
        <option>লক্ষ্মীপুর</option>
        <option>চাঁদপুর</option>
        <option>ব্রাহ্মণবাড়িয়া</option>
        <option>খাগড়াছড়ি</option>
        <option>রাঙামাটি</option>
        <option>বান্দরবান</option>
        <option>কক্সবাজার</option>
        <option>সিলেট</option>
        <option>মৌলভীবাজার</option>
        <option>হবিগঞ্জ</option>
        <option>সুনামগঞ্জ</option>
        <option>রাজশাহী</option>
        <option>নাটোর</option>
        <option>নওগাঁ</option>
        <option>চাঁপাইনবাবগঞ্জ</option>
        <option>পাবনা</option>
        <option>সিরাজগঞ্জ</option>
        <option>বগুড়া</option>
        <option>জয়পুরহাট</option>
        <option>খুলনা</option>
        <option>যশোর</option>
        <option>সাতক্ষীরা</option>
        <option>ঝিনাইদহ</option>
        <option>মাগুরা</option>
        <option>নড়াইল</option>
        <option>কুষ্টিয়া</option>
        <option>চুয়াডাঙ্গা</option>
        <option>মেহেরপুর</option>
        <option>বরিশাল</option>
        <option>ভোলা</option>
        <option>পটুয়াখালী</option>
        <option>বরগুনা</option>
        <option>ঝালকাঠি</option>
        <option>পিরোজপুর</option>
        <option>রংপুর</option>
        <option>দিনাজপুর</option>
        <option>ঠাকুরগাঁও</option>
        <option>পঞ্চগড়</option>
        <option>নীলফামারী</option>
        <option>লালমনিরহাট</option>
        <option>কুড়িগ্রাম</option>
        <option>গাইবান্ধা</option>
        <option>ময়মনসিংহ</option>
        <option>জামালপুর</option>
        <option>শেরপুর</option>
        <option>নেত্রকোণা</option>
        <option>টাঙ্গাইল</option>
        <option>গাজীপুর</option>
        <option>নারায়ণগঞ্জ</option>
        <option>নরসিংদী</option>
        <option>মানিকগঞ্জ</option>
        <option>মুন্সীগঞ্জ</option>
        <option>ফরিদপুর</option>
        <option>গোপালগঞ্জ</option>
        <option>মাদারীপুর</option>
        <option>শরীয়তপুর</option>
        <option>রাজবাড়ী</option>
      </select>

      <label for="mobile">
        মোবাইল নম্বর
      </label>

      <input
        type="tel"
        id="mobile"
        inputmode="numeric"
        placeholder="01XXXXXXXXX"
        maxlength="11"
      >

      <button
        class="start-btn"
        onclick="startExam()"
      >
        🚀 Start Exam
      </button>

      <div id="startStatus"></div>

    </div>


    <!-- EXAM PAGE -->
    <div id="examPage" class="hidden">

      <div class="card">

        <div class="topbar">
          <div
            id="progress"
            class="progress"
          >
            প্রশ্ন 1
          </div>

          <div
            id="timer"
            class="timer"
          >
            10:00
          </div>
        </div>

        <div
          id="questionText"
          class="question"
        ></div>

        <div id="options"></div>

        <div class="nav-buttons">

          <button
            id="prevBtn"
            class="prev-btn"
            onclick="previousQuestion()"
          >
            ← Previous
          </button>

          <button
            id="nextBtn"
            class="next-btn"
            onclick="nextQuestion()"
          >
            Next →
          </button>

          <button
            id="submitBtn"
            class="submit-btn hidden"
            onclick="submitExam()"
          >
            Submit
          </button>

        </div>

      </div>

    </div>


    <!-- RESULT PAGE -->
    <div id="resultPage" class="card result hidden">

      <h2>🎉 পরীক্ষা সম্পন্ন</h2>

      <p id="resultMessage">
        আপনার ফলাফল:
      </p>

      <div
        id="score"
        class="score"
      >
        0 / 0
      </div>

      <p id="percentage"></p>

    </div>

  </div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://ydvbnalhcnfqpxkkmywr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // VARIABLES
  // ==========================================

  let exam = null;

  let questions = [];

  let currentQuestion = 0;

  let answers = {};

  let timerInterval = null;

  let timeLeft = 0;

  let student = {

    name: "",

    facebookName: "",

    district: "",

    mobile: ""

  };


  // ==========================================
  // LOAD EXAM
  // ==========================================

  async function loadExam() {

    const status =
      document.getElementById(
        "startStatus"
      );

    try {

      const { data: exams, error } =
        await supabaseClient

        .from("exams")

        .select("*")

        .eq(
          "is_active",
          true
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        )

        .limit(1);


      if (error) {
        throw error;
      }


      if (
        !exams ||
        exams.length === 0
      ) {

        status.className =
          "status error";

        status.textContent =
          "কোনো সক্রিয় পরীক্ষা পাওয়া যায়নি।";

        return;

      }


      exam = exams[0];


      document.getElementById(
        "examTitle"
      ).textContent =
        exam.title;


      const { data: questionData, error: questionError } =
        await supabaseClient

        .from("questions")

        .select("*")

        .eq(
          "exam_id",
          exam.id
        )

        .order(
          "question_order",
          {
            ascending: true
          }
        );


      if (questionError) {
        throw questionError;
      }


      questions =
        questionData || [];


      if (questions.length === 0) {

        status.className =
          "status error";

        status.textContent =
          "এই পরীক্ষায় কোনো প্রশ্ন নেই।";

        return;

      }


      status.className =
        "status success";

      status.textContent =
        "পরীক্ষা শুরু করার জন্য তথ্য পূরণ করুন।";

    }

    catch (error) {

      console.error(error);

      status.className =
        "status error";

      status.textContent =
        "সমস্যা হয়েছে: " +
        error.message;

    }

  }


  // ==========================================
  // BANGLADESH DATE
  // ==========================================

  function getDhakaDate() {

    return new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Dhaka"
      }
    ).format(
      new Date()
    );

  }


  // ==========================================
  // NORMALIZE MOBILE
  // ==========================================

  function normalizeMobile(value) {

    return String(value)
      .replace(/\D/g, "")
      .trim();

  }


  // ==========================================
  // START EXAM
  // ==========================================

  async function startExam() {

    const name =
      document.getElementById(
        "studentName"
      ).value.trim();

    const facebookName =
      document.getElementById(
        "facebookName"
      ).value.trim();

    const district =
      document.getElementById(
        "district"
      ).value;

    const mobile =
      normalizeMobile(
        document.getElementById(
          "mobile"
        ).value
      );


    const status =
      document.getElementById(
        "startStatus"
      );


    // VALIDATION

    if (!name) {

      showStartError(
        "নাম লিখুন।"
      );

      return;

    }


    if (!facebookName) {

      showStartError(
        "ফেসবুক আইডি নাম লিখুন।"
      );

      return;

    }


    if (!district) {

      showStartError(
        "নিজ জেলা নির্বাচন করুন।"
      );

      return;

    }


    if (
      !/^01[3-9]\d{8}$/.test(
        mobile
      )
    ) {

      showStartError(
        "সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।"
      );

      return;

    }


    if (
      !exam ||
      questions.length === 0
    ) {

      showStartError(
        "পরীক্ষার তথ্য এখনো লোড হয়নি।"
      );

      return;

    }


    status.className =
      "status";

    status.textContent =
      "তথ্য যাচাই হচ্ছে...";


    // ========================================
    // STUDENT RECORD
    //
    // পুরোনো student_id কলামটি database-এ
    // রাখা আছে। এখানে মোবাইল নম্বরকে
    // internal ID হিসেবে ব্যবহার করা হচ্ছে।
    // এটি ছাত্রকে দেখানো হবে না।
    // ========================================

    const internalStudentId =
      "MOBILE-" + mobile;


    // আগে student আছে কিনা দেখি

    let studentRecord = null;


    const { data: existingStudent, error: findError } =
      await supabaseClient

      .from("students")

      .select("*")

      .eq(
        "student_id",
        internalStudentId
      )

      .maybeSingle();


    if (findError) {

      showStartError(
        "Student তথ্য যাচাই করতে সমস্যা হয়েছে: " +
        findError.message
      );

      return;

    }


    if (existingStudent) {

      studentRecord =
        existingStudent;

      // তথ্য আপডেট

      const { data: updatedStudent, error: updateError } =
        await supabaseClient

        .from("students")

        .update({

          name: name,

          facebook_name:
            facebookName,

          district: district,

          mobile: mobile

        })

        .eq(
          "id",
          existingStudent.id
        )

        .select()

        .single();


      if (updateError) {

        showStartError(
          "Student তথ্য আপডেট করতে সমস্যা হয়েছে: " +
          updateError.message
        );

        return;

      }


      studentRecord =
        updatedStudent;

    }

    else {

      const { data: newStudent, error: insertError } =
        await supabaseClient

        .from("students")

        .insert({

          student_id:
            internalStudentId,

          name: name,

          facebook_name:
            facebookName,

          district: district,

          mobile: mobile

        })

        .select()

        .single();


      if (insertError) {

        showStartError(
          "Student তথ্য সংরক্ষণ করতে সমস্যা হয়েছে: " +
          insertError.message
        );

        return;

      }


      studentRecord =
        newStudent;

    }


    // ========================================
    // CHECK TODAY'S ATTEMPT
    // ========================================

    const today =
      getDhakaDate();


    const { data: previousAttempt, error: attemptError } =
      await supabaseClient

      .from("exam_attempts")

      .select("id")

      .eq(
        "exam_id",
        exam.id
      )

      .eq(
        "student_id",
        studentRecord.id
      )

      .eq(
        "attempt_date",
        today
      )

      .maybeSingle();


    if (attemptError) {

      showStartError(
        "আগের পরীক্ষার তথ্য যাচাই করতে সমস্যা হয়েছে: " +
        attemptError.message
      );

      return;

    }


    if (previousAttempt) {

      showStartError(
        "এই মোবাইল নম্বর দিয়ে আজ ইতিমধ্যে পরীক্ষা দেওয়া হয়েছে। আজ আর দ্বিতীয়বার পরীক্ষা দেওয়া যাবে না।"
      );

      return;

    }


    // ========================================
    // SAVE STUDENT DATA
    // ========================================

    student = {

      name: name,

      facebookName:
        facebookName,

      district: district,

      mobile: mobile

    };


    // ========================================
    // START
    // ========================================

    document.getElementById(
      "startPage"
    ).classList.add("hidden");


    document.getElementById(
      "examPage"
    ).classList.remove("hidden");


    timeLeft =
      Number(
        exam.duration_minutes || 20
      ) * 60;


    currentQuestion = 0;

    answers = {};


    renderQuestion();

    startTimer();

  }


  // ==========================================
  // ERROR
  // ==========================================

  function showStartError(message) {

    const status =
      document.getElementById(
        "startStatus"
      );

    status.className =
      "status error";

    status.textContent =
      "❌ " + message;

  }


  // ==========================================
  // RENDER QUESTION
  // ==========================================

  function renderQuestion() {

    const q =
      questions[currentQuestion];


    document.getElementById(
      "progress"
    ).textContent =
      "প্রশ্ন " +
      (currentQuestion + 1) +
      " / " +
      questions.length;


    document.getElementById(
      "questionText"
    ).textContent =
      q.question_text;


    const options =
      document.getElementById(
        "options"
      );


    options.innerHTML = "";


    const optionList = [

      ["A", q.option_a],

      ["B", q.option_b],

      ["C", q.option_c],

      ["D", q.option_d]

    ];


    optionList.forEach(
      ([letter, text]) => {

        const label =
          document.createElement(
            "label"
          );

        label.className =
          "option";


        label.innerHTML = `

          <input
            type="radio"
            name="answer"
            value="${letter}"
            ${
              answers[q.id] === letter
                ? "checked"
                : ""
            }
          >

          <strong>${letter}.</strong>
          ${escapeHtml(text)}

        `;


        label
          .querySelector("input")
          .addEventListener(
            "change",
            function() {

              answers[q.id] =
                this.value;

            }
          );


        options.appendChild(
          label
        );

      }
    );


    const prevBtn =
      document.getElementById(
        "prevBtn"
      );

    const nextBtn =
      document.getElementById(
        "nextBtn"
      );

    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    prevBtn.style.visibility =
      currentQuestion === 0
        ? "hidden"
        : "visible";


    if (
      currentQuestion ===
      questions.length - 1
    ) {

      nextBtn.classList.add(
        "hidden"
      );

      submitBtn.classList.remove(
        "hidden"
      );

    }

    else {

      nextBtn.classList.remove(
        "hidden"
      );

      submitBtn.classList.add(
        "hidden"
      );

    }

  }


  // ==========================================
  // NEXT
  // ==========================================

  function nextQuestion() {

    if (
      currentQuestion <
      questions.length - 1
    ) {

      currentQuestion++;

      renderQuestion();

    }

  }


  // ==========================================
  // PREVIOUS
  // ==========================================

  function previousQuestion() {

    if (
      currentQuestion > 0
    ) {

      currentQuestion--;

      renderQuestion();

    }

  }


  // ==========================================
  // TIMER
  // ==========================================

  function startTimer() {

    updateTimer();


    timerInterval =
      setInterval(
        function() {

          timeLeft--;

          updateTimer();


          if (
            timeLeft <= 0
          ) {

            clearInterval(
              timerInterval
            );

            submitExam(
              true
            );

          }

        },
        1000
      );

  }


  function updateTimer() {

    const minutes =
      Math.floor(
        timeLeft / 60
      );

    const seconds =
      timeLeft % 60;


    document.getElementById(
      "timer"
    ).textContent =

      String(minutes)
        .padStart(2, "0")

      + ":" +

      String(seconds)
        .padStart(2, "0");

  }


  // ==========================================
  // SUBMIT
  // ==========================================

  async function submitExam(
    autoSubmit = false
  ) {

    if (!autoSubmit) {

      const confirmed =
        confirm(
          "আপনি কি পরীক্ষা জমা দিতে চান?"
        );

      if (!confirmed) {
        return;
      }

    }


    if (
      !exam ||
      !student.mobile
    ) {

      return;

    }


    clearInterval(
      timerInterval
    );


    let score = 0;


    questions.forEach(
      q => {

        if (
          answers[q.id] ===
          q.correct_option
        ) {

          score++;

        }

      }
    );


    const total =
      questions.length;


    const today =
      getDhakaDate();


    // ========================================
    // GET STUDENT RECORD
    // ========================================

    const internalStudentId =
      "MOBILE-" +
      student.mobile;


    const { data: studentRecord, error: studentError } =
      await supabaseClient

      .from("students")

      .select("*")

      .eq(
        "student_id",
        internalStudentId
      )

      .single();


    if (studentError) {

      alert(
        "Student তথ্য পাওয়া যায়নি। আবার চেষ্টা করুন।"
      );

      return;

    }


    // ========================================
    // INSERT ATTEMPT
    // ========================================

    const { data: attempt, error: attemptError } =
      await supabaseClient

      .from("exam_attempts")

      .insert({

        exam_id:
          exam.id,

        student_id:
          studentRecord.id,

        score: score,

        total_questions:
          total,

        attempt_date:
          today

      })

      .select()

      .single();


    if (attemptError) {

      console.error(
        attemptError
      );


      if (
        attemptError.code ===
        "23505"
      ) {

        alert(
          "এই পরীক্ষাটি আজ ইতিমধ্যে দেওয়া হয়েছে।"
        );

      }

      else {

        alert(
          "ফলাফল সংরক্ষণ করতে সমস্যা হয়েছে: " +
          attemptError.message
        );

      }

      return;

    }


    // ========================================
    // SAVE ANSWERS
    // ========================================

    const answerRows =
      questions.map(
        q => ({

          attempt_id:
            attempt.id,

          question_id:
            q.id,

          selected_option:
            answers[q.id] ||
            null,

          is_correct:
            answers[q.id] ===
            q.correct_option

        })
      );


    const {
      error: answerError
    } = await supabaseClient

      .from(
        "attempt_answers"
      )

      .insert(
        answerRows
      );


    if (answerError) {

      console.error(
        answerError
      );

    }


    // ========================================
    // SHOW RESULT
    // ========================================

    document.getElementById(
      "examPage"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "resultPage"
    ).classList.remove(
      "hidden"
    );


    document.getElementById(
      "score"
    ).textContent =

      score +
      " / " +
      total;


    const percentage =
      total > 0
        ? Math.round(
            (score / total) *
            100
          )
        : 0;


    document.getElementById(
      "percentage"
    ).textContent =

      "আপনার প্রাপ্ত নম্বর: " +
      percentage +
      "%";


    document.getElementById(
      "resultMessage"
    ).textContent =

      autoSubmit
        ? "⏰ সময় শেষ হওয়ায় পরীক্ষা জমা হয়েছে।"
        : "🎉 আপনার পরীক্ষা সফলভাবে জমা হয়েছে।";

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================
  // START
  // ==========================================

  loadExam();

</script>
