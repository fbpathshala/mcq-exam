<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Exam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali",Arial,sans-serif;background:#f3f6fb;color:#1f2937}.header{background:#2563eb;color:#fff;text-align:center;padding:20px 15px}.header h1{margin:0;font-size:25px}.container{max-width:760px;margin:22px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-bottom:18px}h2{margin-top:0;font-size:21px}label.field{display:block;margin-top:15px;margin-bottom:6px;font-weight:700}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;background:#fff}.btn{border:0;border-radius:8px;padding:12px 18px;font-size:16px;cursor:pointer}.start-btn{width:100%;margin-top:22px;background:#2563eb;color:#fff}.next-btn{background:#2563eb;color:#fff}.prev-btn{background:#6b7280;color:#fff}.submit-btn{background:#16a34a;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.question{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:18px}.option{display:flex;align-items:flex-start;gap:8px;background:#f8fafc;border:1px solid #e5e7eb;padding:13px;margin:10px 0;border-radius:9px;cursor:pointer}.option:hover{background:#eff6ff}.option.locked{cursor:default}.option input{width:auto;margin-top:3px}.topbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px;font-weight:700}.timer{color:#dc2626}.progress{color:#2563eb}.nav-buttons{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.nav-buttons button{flex:1}.status{padding:12px;border-radius:8px;margin-top:15px;background:#eff6ff;color:#1d4ed8}.error{background:#fef2f2;color:#b91c1c}.success{background:#f0fdf4;color:#15803d}.result{text-align:center}.score{font-size:40px;font-weight:800;color:#2563eb;margin:18px 0}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.result-box{background:#f8fafc;border-radius:10px;padding:14px}.result-box strong{display:block;font-size:24px}.review{text-align:left;margin-top:20px}.review-item{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:10px 0}.correct{color:#15803d}.wrong{color:#b91c1c}.muted{color:#6b7280}.hidden{display:none!important}@media(max-width:600px){.header h1{font-size:21px}.card{padding:17px}.question{font-size:18px}.result-grid{grid-template-columns:1fr}.nav-buttons{flex-wrap:wrap}.nav-buttons button{min-width:45%}}
</style>
</head>
<body>
<div class="header"><h1>📝 MCQ Exam</h1></div>
<div class="container">
<div id="startPage" class="card">
<h2 id="examTitle">Exam</h2>
<p id="examInfo">পরীক্ষা শুরু করার আগে নিচের তথ্যগুলো সঠিকভাবে পূরণ করুন।</p>
<label class="field" for="studentName">নাম</label><input id="studentName" type="text" placeholder="আপনার নাম লিখুন" autocomplete="name">
<label class="field" for="facebookName">ফেসবুক আইডি নাম</label><input id="facebookName" type="text" placeholder="ফেসবুকে ব্যবহৃত নাম লিখুন">
<label class="field" for="district">নিজ জেলা</label>
<select id="district"><option value="">জেলা নির্বাচন করুন</option></select>
<label class="field" for="mobile">মোবাইল নম্বর</label><input id="mobile" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" maxlength="11" autocomplete="tel">
<button class="btn start-btn" id="startButton" onclick="startExam()">🚀 পরীক্ষা শুরু করুন</button>
<div id="startStatus"></div>
</div>
<div id="examPage" class="hidden"><div class="card">
<div class="topbar"><div id="progress" class="progress">প্রশ্ন ১</div><div id="timer" class="timer">00:00</div></div>
<div id="questionText" class="question"></div><div id="options"></div>
<div class="nav-buttons"><button id="prevBtn" class="btn prev-btn" onclick="previousQuestion()">← পূর্বের</button><button id="nextBtn" class="btn next-btn" onclick="nextQuestion()">পরের →</button><button id="submitBtn" class="btn submit-btn hidden" onclick="submitExam(false)">জমা দিন</button></div>
</div></div>
<div id="resultPage" class="card result hidden"><h2>🎉 পরীক্ষা সম্পন্ন</h2><p id="resultMessage">আপনার ফলাফল:</p><div id="score" class="score">0</div><div class="result-grid"><div class="result-box">প্রাপ্ত নম্বর<strong id="marks">0</strong></div><div class="result-box">শতকরা<strong id="percentage">0%</strong></div><div class="result-box">অবস্থান<strong id="rank">—</strong></div><div class="result-box">মোট পরীক্ষার্থী<strong id="rankTotal">—</strong></div></div><p id="passStatus"></p><div id="review" class="review hidden"></div></div>
</div>
<script>
const SUPABASE_URL="https://ydvbnalhcnfqpxkkmywr.supabase.co";
const SUPABASE_KEY="sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const districts=["ঢাকা","চট্টগ্রাম","কুমিল্লা","ফেনী","নোয়াখালী","লক্ষ্মীপুর","চাঁদপুর","ব্রাহ্মণবাড়িয়া","খাগড়াছড়ি","রাঙামাটি","বান্দরবান","কক্সবাজার","সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ","রাজশাহী","নাটোর","নওগাঁ","চাঁপাইনবাবগঞ্জ","পাবনা","সিরাজগঞ্জ","বগুড়া","জয়পুরহাট","খুলনা","যশোর","সাতক্ষীরা","ঝিনাইদহ","মাগুরা","নড়াইল","কুষ্টিয়া","চুয়াডাঙ্গা","মেহেরপুর","বরিশাল","ভোলা","পটুয়াখালী","বরগুনা","ঝালকাঠি","পিরোজপুর","রংপুর","দিনাজপুর","ঠাকুরগাঁও","পঞ্চগড়","নীলফামারী","লালমনিরহাট","কুড়িগ্রাম","গাইবান্ধা","ময়মনসিংহ","জামালপুর","শেরপুর","নেত্রকোণা","টাঙ্গাইল","গাজীপুর","নারায়ণগঞ্জ","নরসিংদী","মানিকগঞ্জ","মুন্সীগঞ্জ","ফরিদপুর","গোপালগঞ্জ","মাদারীপুর","শরীয়তপুর","রাজবাড়ী"];
const bnDigits="০১২৩৪৫৬৭৮৯", optionLetters={A:"ক",B:"খ",C:"গ",D:"ঘ"};
let exam=null,settings=null,questions=[],currentQuestion=0,answers={},timerInterval=null,timeLeft=0,student={},deviceToken="",resultData=null,optionMaps={};
function bn(n){return String(n).replace(/\d/g,d=>bnDigits[d])}
function getDhakaDate(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Dhaka"}).format(new Date())}
function getExamId(){const p=new URLSearchParams(location.search).get("exam");return p&&/^\d+$/.test(p)?Number(p):null}
function getDeviceToken(){const k="mcq_exam_device_token_v1";let t=localStorage.getItem(k);if(!t){t=crypto.randomUUID?crypto.randomUUID():"d-"+Date.now()+"-"+Math.random().toString(36).slice(2);localStorage.setItem(k,t)}return t}
function showStartError(m){const s=document.getElementById("startStatus");s.className="status error";s.textContent="❌ "+m}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function renderDistricts(){const s=document.getElementById("district");districts.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d;s.appendChild(o)})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function loadExam(){
 const status=document.getElementById("startStatus");
 try{
  const examId=getExamId(); let q=supabaseClient.from("exams").select("*");
  q=examId?q.eq("id",examId):q.eq("is_active",true).order("created_at",{ascending:false}).limit(1);
  const {data:exams,error}=await q; if(error)throw error; if(!exams?.length)throw new Error("কোনো সক্রিয়/নির্বাচিত পরীক্ষা পাওয়া যায়নি।"); exam=exams[0];
  document.getElementById("examTitle").textContent=exam.title;
  let st=null;
  try {
    const r=await supabaseClient.from("exam_settings").select("*").eq("exam_id",exam.id).maybeSingle();
    if(!r.error) st=r.data;
    else console.warn("exam_settings unavailable; using exam defaults", r.error.message);
  } catch(e) { console.warn("exam_settings unavailable; using exam defaults", e); }
  settings=st||{duration_minutes:exam.duration_minutes||20,total_questions:0,marks_per_question:1,negative_mark:0,total_marks:0,pass_mark:0,show_answers:true,random_questions:false,random_options:false};
  const {data:qs,error:qe}=await supabaseClient.from("student_questions").select("id,exam_id,category,question_text,option_a,option_b,option_c,option_d,question_order").eq("exam_id",exam.id).order("question_order",{ascending:true});
  if(qe)throw qe; let allQuestions=qs||[];
  if(!allQuestions.length)throw new Error("এই পরীক্ষায় কোনো প্রশ্ন নেই।");
  const {data:catSettings,error:cse}=await supabaseClient.from("exam_category_settings").select("category,question_count").eq("exam_id",exam.id);
  if(cse && cse.code!=="42501")throw cse;
  questions=[];
  if(catSettings?.length){
    for(const cs of catSettings){const pool=allQuestions.filter(q=>q.category===cs.category);shuffle(pool);questions.push(...pool.slice(0,Number(cs.question_count||0)));}
  }else questions=allQuestions.slice();
  if(settings.random_questions)shuffle(questions);
  if(settings.total_questions>0)questions=questions.slice(0,Number(settings.total_questions));
  optionMaps={};
  questions.forEach(q=>{let arr=["A","B","C","D"];if(settings.random_options)shuffle(arr);optionMaps[q.id]=arr;});
  document.getElementById("examInfo").textContent=`${exam.title} — ${bn(questions.length)}টি প্রশ্ন | সময়: ${bn(Number(settings.duration_minutes||20))} মিনিট`;
  status.className="status success";status.textContent="পরীক্ষা শুরু করার জন্য তথ্য পূরণ করুন।";
 }catch(e){console.error(e);status.className="status error";status.textContent="সমস্যা হয়েছে: "+e.message+" (প্রয়োজনে final SQL চালাতে হবে)"}
}
async function startExam(){
 const name=document.getElementById("studentName").value.trim(),facebookName=document.getElementById("facebookName").value.trim(),district=document.getElementById("district").value,mobile=document.getElementById("mobile").value.replace(/\D/g,"").trim();
 if(!name)return showStartError("নাম লিখুন।"); if(!facebookName)return showStartError("ফেসবুক আইডি নাম লিখুন।"); if(!district)return showStartError("নিজ জেলা নির্বাচন করুন।"); if(!/^01[3-9]\d{8}$/.test(mobile))return showStartError("সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।"); if(!exam||!questions.length)return showStartError("পরীক্ষার তথ্য এখনো লোড হয়নি।");
 const status=document.getElementById("startStatus");status.className="status";status.textContent="তথ্য যাচাই হচ্ছে...";document.getElementById("startButton").disabled=true;
 student={name,facebookName,district,mobile};deviceToken=getDeviceToken();
 const now=new Date();
 if(settings.exam_date && getDhakaDate()!==settings.exam_date)return showStartError("এই পরীক্ষার তারিখ এখন নয়।");
 if(settings.start_time||settings.end_time){const t=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit",hour12:false}).format(now);if(settings.start_time&&t<settings.start_time.slice(0,5))return showStartError("পরীক্ষা এখনো শুরু হয়নি।");if(settings.end_time&&t>settings.end_time.slice(0,5))return showStartError("পরীক্ষার সময় শেষ হয়েছে।")}
 try{
  const {data:check,error:ce}=await supabaseClient.rpc("check_exam_attempt",{p_exam_id:exam.id,p_mobile:mobile,p_device_token:deviceToken,p_attempt_date:getDhakaDate()});
  if(ce)throw ce;
  if(check?.already_attempted)throw new Error(check.reason||"এই পরীক্ষাটি আজ ইতিমধ্যে দেওয়া হয়েছে।");
  document.getElementById("startPage").classList.add("hidden");document.getElementById("examPage").classList.remove("hidden");timeLeft=Number(settings.duration_minutes||exam.duration_minutes||20)*60;currentQuestion=0;answers={};renderQuestion();startTimer();
 }catch(e){console.error(e);showStartError(e.message||"তথ্য যাচাই করতে সমস্যা হয়েছে।");document.getElementById("startButton").disabled=false}
}
function renderQuestion(){const q=questions[currentQuestion];document.getElementById("progress").textContent=`প্রশ্ন ${bn(currentQuestion+1)} / ${bn(questions.length)}`;document.getElementById("questionText").textContent=q.question_text;const options=document.getElementById("options");options.innerHTML="";const map=optionMaps[q.id]||["A","B","C","D"];map.forEach((originalLetter,displayIndex)=>{const text=q["option_"+originalLetter.toLowerCase()];const label=document.createElement("label");label.className="option";const checked=answers[q.id]===originalLetter;label.innerHTML=`<input type="radio" name="answer" value="${originalLetter}" ${checked?"checked":""} ${checked?"disabled":""}><strong>${optionLetters[String.fromCharCode(65+displayIndex)]}.</strong><span>${escapeHtml(text)}</span>`;const input=label.querySelector("input");if(!answers[q.id])input.addEventListener("change",()=>{answers[q.id]=input.value;lockCurrentOptions()});else label.classList.add("locked");options.appendChild(label)});lockCurrentOptions();document.getElementById("prevBtn").style.visibility=currentQuestion===0?"hidden":"visible";const last=currentQuestion===questions.length-1;document.getElementById("nextBtn").classList.toggle("hidden",last);document.getElementById("submitBtn").classList.toggle("hidden",!last)}
function lockCurrentOptions(){if(!answers[questions[currentQuestion]?.id])return;document.querySelectorAll('#options input[type="radio"]').forEach(i=>{i.disabled=true});document.querySelectorAll("#options .option").forEach(x=>x.classList.add("locked"))}
function nextQuestion(){if(currentQuestion<questions.length-1){currentQuestion++;renderQuestion()}}
function previousQuestion(){if(currentQuestion>0){currentQuestion--;renderQuestion()}}
function startTimer(){updateTimer();clearInterval(timerInterval);timerInterval=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerInterval);submitExam(true)}},1000)}
function updateTimer(){const m=Math.floor(Math.max(0,timeLeft)/60),s=Math.max(0,timeLeft)%60;document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
async function submitExam(autoSubmit=false){if(!autoSubmit&&!confirm("আপনি কি পরীক্ষা জমা দিতে চান?"))return;if(!exam||!student.mobile)return;clearInterval(timerInterval);const btn=document.getElementById("submitBtn");btn.disabled=true;try{const payload=Object.fromEntries(Object.entries(answers).map(([k,v])=>[String(k),v]));const {data,error}=await supabaseClient.rpc("submit_exam",{p_exam_id:exam.id,p_name:student.name,p_facebook_name:student.facebookName,p_district:student.district,p_mobile:student.mobile,p_device_token:deviceToken,p_answers:payload});if(error)throw error;if(!data?.success)throw new Error(data?.message||"পরীক্ষা জমা দেওয়া যায়নি।");resultData=data;showResult(autoSubmit)}catch(e){console.error(e);btn.disabled=false;if(e.code==="23505")alert("এই পরীক্ষাটি আজ ইতিমধ্যে দেওয়া হয়েছে।");else alert("ফলাফল সংরক্ষণ করতে সমস্যা হয়েছে: "+e.message)}}
function showResult(autoSubmit){document.getElementById("examPage").classList.add("hidden");document.getElementById("resultPage").classList.remove("hidden");const total=Number(resultData.total_marks||0),score=Number(resultData.score||0),pct=Number(resultData.percentage||0);document.getElementById("score").textContent=score+" / "+total;document.getElementById("marks").textContent=score;document.getElementById("percentage").textContent=Math.round(pct)+"%";document.getElementById("rank").textContent=resultData.rank?bn(resultData.rank):"—";document.getElementById("rankTotal").textContent=resultData.rank_total?bn(resultData.rank_total):"—";document.getElementById("resultMessage").textContent=autoSubmit?"⏰ সময় শেষ হওয়ায় পরীক্ষা জমা হয়েছে।":"🎉 আপনার পরীক্ষা সফলভাবে জমা হয়েছে।";const pass=Number(resultData.pass_mark||0)<=score;document.getElementById("passStatus").textContent=resultData.pass_mark?((pass?"✅ উত্তীর্ণ":"❌ অনুত্তীর্ণ")+` — পাস নম্বর ${resultData.pass_mark}`):"";if(settings?.show_answers!==false&&Array.isArray(resultData.review))renderReview(resultData.review)}
function renderReview(items){const box=document.getElementById("review");box.classList.remove("hidden");box.innerHTML="<h3>উত্তর পর্যালোচনা</h3>";items.forEach((r,i)=>{const ok=r.is_correct;const div=document.createElement("div");div.className="review-item";div.innerHTML=`<strong>${bn(i+1)}. ${escapeHtml(r.question_text||"")}</strong><p>আপনার উত্তর: <span class="${ok?"correct":"wrong"}">${r.selected_option?optionLetters[r.selected_option]+". "+escapeHtml(r.selected_text||""):"দেওয়া হয়নি"}</span></p><p>সঠিক উত্তর: <span class="correct">${optionLetters[r.correct_option]}. ${escapeHtml(r.correct_text||"")}</span></p>`;box.appendChild(div)})}
renderDistricts();loadExam();
</script>
</body>
</html>
