<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MCQ Exam — Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      color: #2563eb;
    }

    .stat-title {
      margin-top: 5px;
      color: #6b7280;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 10px;
      text-align: left;
    }

    th {
      background: #f8fafc;
      font-weight: bold;
    }

    tr:hover {
      background: #f9fafb;
    }

    .refresh {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .refresh:hover {
      background: #1d4ed8;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .success {
      background: #f0fdf4;
      color: #15803d;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 21px;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📊 MCQ Exam — Admin Panel</h1>
  </div>

  <div class="container">

    <div id="status" class="status">
      ফলাফল লোড হচ্ছে...
    </div>

    <div class="stats">

      <div class="stat">
        <div id="totalAttempts" class="stat-number">0</div>
        <div class="stat-title">মোট পরীক্ষা</div>
      </div>

      <div class="stat">
        <div id="uniqueStudents" class="stat-number">0</div>
        <div class="stat-title">অংশগ্রহণকারী</div>
      </div>

      <div class="stat">
        <div id="averageScore" class="stat-number">0%</div>
        <div class="stat-title">গড় শতাংশ</div>
      </div>

    </div>

    <div class="card">

      <h2>📝 পরীক্ষার ফলাফল</h2>

      <button class="refresh" onclick="loadResults()">
        🔄 Refresh
      </button>

      <br><br>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Student ID</th>
              <th>নাম</th>
              <th>Exam</th>
              <th>স্কোর</th>
              <th>শতাংশ</th>
              <th>জমা দেওয়ার সময়</th>
            </tr>
          </thead>

          <tbody id="resultsBody">
          </tbody>

        </table>

      </div>

    </div>

  </div>


<script>

  // ==============================
  // SUPABASE CONNECTION
  // ==============================

  const SUPABASE_URL =
    "https://ydvbnalhcnfqpxkkmywr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // LOAD RESULTS
  // ==============================

  async function loadResults() {

    const status =
      document.getElementById("status");

    status.className = "status";
    status.textContent =
      "ফলাফল লোড হচ্ছে...";


    try {

      const { data, error } =
        await supabaseClient

        .from("exam_attempts")

        .select(`
          id,
          score,
          total_questions,
          submitted_at,
          attempt_date,
          exams (
            title
          ),
          students (
            student_id,
            name
          )
        `)

        .order(
          "submitted_at",
          {
            ascending: false
          }
        );


      if (error) {
        throw error;
      }


      const tbody =
        document.getElementById(
          "resultsBody"
        );

      tbody.innerHTML = "";


      if (!data || data.length === 0) {

        tbody.innerHTML = `
          <tr>
            <td colspan="6"
                style="text-align:center;">
              এখনো কোনো পরীক্ষা দেওয়া হয়নি।
            </td>
          </tr>
        `;

        updateStats([]);

        status.className =
          "status";

        status.textContent =
          "কোনো ফলাফল পাওয়া যায়নি।";

        return;
      }


      data.forEach(attempt => {

        const student =
          attempt.students || {};

        const exam =
          attempt.exams || {};


        const total =
          Number(
            attempt.total_questions || 0
          );

        const score =
          Number(
            attempt.score || 0
          );


        const percentage =
          total > 0
            ? Math.round(
                (score / total) * 100
              )
            : 0;


        const submitted =
          attempt.submitted_at
            ? new Date(
                attempt.submitted_at
              ).toLocaleString(
                "bn-BD",
                {
                  timeZone:
                    "Asia/Dhaka"
                }
              )
            : "-";


        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${escapeHtml(
              student.student_id || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              student.name || "-"
            )}
          </td>

          <td>
            ${escapeHtml(
              exam.title || "-"
            )}
          </td>

          <td>
            ${score} / ${total}
          </td>

          <td>
            ${percentage}%
          </td>

          <td>
            ${submitted}
          </td>

        `;


        tbody.appendChild(row);

      });


      updateStats(data);


      status.className =
        "status success";

      status.textContent =
        "✅ ফলাফল সফলভাবে লোড হয়েছে।";

    }

    catch (error) {

      console.error(error);

      status.className =
        "status error";

      status.textContent =
        "❌ ফলাফল লোড করতে সমস্যা হয়েছে: "
        + error.message;

    }

  }


  // ==============================
  // STATISTICS
  // ==============================

  function updateStats(data) {

    document.getElementById(
      "totalAttempts"
    ).textContent =
      data.length;


    const students =
      new Set();

    let totalPercentage = 0;


    data.forEach(attempt => {

      if (
        attempt.students &&
        attempt.students.student_id
      ) {

        students.add(
          attempt.students.student_id
        );

      }


      const total =
        Number(
          attempt.total_questions || 0
        );

      const score =
        Number(
          attempt.score || 0
        );


      if (total > 0) {

        totalPercentage +=
          (score / total) * 100;

      }

    });


    document.getElementById(
      "uniqueStudents"
    ).textContent =
      students.size;


    const average =
      data.length > 0
        ? Math.round(
            totalPercentage /
            data.length
          )
        : 0;


    document.getElementById(
      "averageScore"
    ).textContent =
      average + "%";

  }


  // ==============================
  // SECURITY: HTML ESCAPE
  // ==============================

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==============================
  // START
  // ==============================

  loadResults();

</script>

</body>
</html>
