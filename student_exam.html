<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCQ Exam Student</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#17202a;font-family:Arial,"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000d}h1,h2{margin:0 0 10px}.muted{color:#667085;font-size:14px}label{display:block;font-weight:600;margin:12px 0 6px}input[type=text]{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font-size:16px}button{border:0;border-radius:9px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}.hidden{display:none}.msg{padding:11px;border-radius:9px;background:#fff3cd;margin:12px 0}.error{background:#fee2e2}.success{background:#dcfce7}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-weight:700;background:#eef2ff;padding:10px 13px;border-radius:9px}.q{font-weight:700;line-height:1.5;margin-bottom:12px}.opt{border:1px solid #d0d5dd;border-radius:9px;padding:11px;margin:8px 0;cursor:pointer;font-weight:400}.opt input{width:auto;margin-right:8px}.actions{display:flex;justify-content:flex-end;margin-top:16px}
</style></head><body><div class="wrap"><div id="message" class="msg hidden"></div><div id="loading" class="card">পরীক্ষা লোড হচ্ছে...</div>
<div id="login" class="card hidden"><h1 id="examTitle">MCQ Exam</h1><p id="examInfo" class="muted"></p><label>নাম *</label><input id="name" type="text"><label>Facebook নাম</label><input id="facebook" type="text"><label>জেলা</label><input id="district" type="text"><label>মোবাইল নম্বর</label><input id="mobile" type="text"><div class="actions"><button id="startBtn">পরীক্ষা শুরু করুন</button></div></div>
<div id="exam" class="hidden"><div class="card top"><div><h2 id="runningTitle"></h2><div id="progress" class="muted"></div></div><div id="timer" class="timer">--:--</div></div><div id="questions"></div><div class="card actions"><button id="submitBtn">পরীক্ষা জমা দিন</button></div></div><div id="done" class="card hidden"></div></div>
<script>
const SUPABASE_URL="https://ydvbnalhcnfqpxkkmywr.supabase.co";const SUPABASE_KEY="sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const examId=new URLSearchParams(location.search).get("exam");let exam=null,questions=[],timerId=null,secondsLeft=0,submitted=false,student={};const $=id=>document.getElementById(id);function msg(t,c=""){const e=$("message");e.textContent=t;e.className="msg "+c}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function loadExam(){if(!examId){$("loading").classList.add("hidden");msg("পরীক্ষার লিংকে exam ID নেই।","error");return}const {data:e,error:ee}=await db.from("exams").select("*").eq("id",examId).maybeSingle();if(ee||!e){$("loading").classList.add("hidden");msg("পরীক্ষাটি পাওয়া যায়নি।","error");return}if(e.is_active===false){$("loading").classList.add("hidden");msg("এই পরীক্ষা বর্তমানে সক্রিয় নয়।","error");return}exam=e;const {data:qs,error:eq}=await db.from("questions").select("id,question,option_a,option_b,option_c,option_d,correct_answer,question_order").eq("exam_id",examId).order("question_order",{ascending:true});if(eq){$("loading").classList.add("hidden");msg("প্রশ্ন লোড করা যায়নি: "+eq.message,"error");return}questions=qs||[];$("loading").classList.add("hidden");$("examTitle").textContent=exam.title||"MCQ Exam";$("examInfo").textContent=`প্রশ্ন: ${questions.length} | সময়: ${exam.duration_minutes||0} মিনিট`;
$("login").classList.remove("hidden")}
function render(){ $("runningTitle").textContent=exam.title||"MCQ Exam";$("progress").textContent=`মোট প্রশ্ন: ${questions.length}`;$("questions").innerHTML=questions.map((q,i)=>`<div class="card"><div class="q">${i+1}. ${esc(q.question)}</div>${["a","b","c","d"].map(x=>`<label class="opt"><input type="radio" name="q_${q.id}" value="${x.toUpperCase()}">${esc(q["option_"+x])}</label>`).join("")}</div>`).join("")}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;$("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}function startTimer(){secondsLeft=Math.max(0,Number(exam.duration_minutes||0)*60);tick();clearInterval(timerId);timerId=setInterval(()=>{secondsLeft--;tick();if(secondsLeft<=0){clearInterval(timerId);submitExam(true)}},1000)}function collect(){const a={};questions.forEach(q=>{const x=document.querySelector(`input[name="q_${q.id}"]:checked`);a[String(q.id)]=x?x.value:""});return a}
async function start(){const name=$("name").value.trim();if(!name){msg("নাম লিখুন।","error");return}student={name,facebook_name:$("facebook").value.trim(),district:$("district").value.trim(),mobile:$("mobile").value.trim()};$("login").classList.add("hidden");$("exam").classList.remove("hidden");render();startTimer();scrollTo(0,0)}
async function submitExam(auto=false){if(submitted)return;if(!auto&&!confirm("আপনি কি পরীক্ষা জমা দিতে চান?"))return;submitted=true;clearInterval(timerId);$("submitBtn").disabled=true;const answers=collect(),marks=Number(exam.marks_per_question||1),negative=Number(exam.negative_mark||0);let score=0;questions.forEach(q=>{const a=answers[String(q.id)];if(!a)return;if(a===String(q.correct_answer||"").toUpperCase())score+=marks;else score-=negative});const {data:sr,error:se}=await db.from("students").insert(student).select("id").single();if(se){submitted=false;$("submitBtn").disabled=false;msg("শিক্ষার্থীর তথ্য সংরক্ষণ করা যায়নি: "+se.message,"error");return}const attempt={exam_id:examId,student_id:sr.id,score,total_questions:questions.length,submitted_at:new Date().toISOString(),answers:JSON.stringify(answers)};const {error:ae}=await db.from("exam_attempts").insert(attempt);if(ae){submitted=false;$("submitBtn").disabled=false;msg("ফলাফল সংরক্ষণ করা যায়নি: "+ae.message,"error");return}$("exam").classList.add("hidden");$("done").classList.remove("hidden");$("done").innerHTML=`<h2>পরীক্ষা জমা হয়েছে ✅</h2><p>শিক্ষার্থী: <b>${esc(student.name)}</b></p><p>স্কোর: <b>${score}</b></p><p class="muted">আপনার উত্তর সংরক্ষণ করা হয়েছে।</p>`;scrollTo(0,0)}
$("startBtn").addEventListener("click",start);$("submitBtn").addEventListener("click",()=>submitExam(false));loadExam();
</script></body></html>
