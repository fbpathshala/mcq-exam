<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Solution</title><style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f6f8;margin:0;color:#222}.wrap{max-width:950px;margin:auto;padding:12px}.card{background:#fff;padding:16px;margin:10px 0;border-radius:12px}.q{border:1px solid #ddd;padding:14px;margin:10px 0;border-radius:10px}.chip{display:inline-block;background:#eef3f7;padding:4px 8px;border-radius:20px;margin:2px;font-size:12px}.ans{font-weight:bold;margin-top:8px}.exp{background:#f5f5f5;padding:9px;margin-top:7px;line-height:1.65}.cat{margin-top:18px}.cat h2{background:#eaf1f8;padding:10px;border-radius:8px}.muted{color:#666}</style></head><body><div class="wrap"><div id="app" class="card">লোড হচ্ছে...</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");const id=new URLSearchParams(location.search).get("job");const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const L={A:"ক",B:"খ",C:"গ",D:"ঘ"};function cat(v){return String(v||"ক্যাটাগরি নেই").trim()}async function go(){if(!id){app.innerHTML="Job Solution ID পাওয়া যায়নি।";return}const j=await db.from("job_solutions").select("*").eq("id",id).single();if(j.error){app.innerHTML="Job Solution পাওয়া যায়নি।";return}const r=await db.from("job_solution_questions").select("question_id,question_order").eq("job_solution_id",id).order("question_order");if(r.error){app.innerHTML=r.error.message;return}const ids=(r.data||[]).map(x=>x.question_id);const q=ids.length?await db.from("questions").select("*").in("id",ids):{data:[],error:null};if(q.error){app.innerHTML=q.error.message;return}const byId=new Map((q.data||[]).map(x=>[String(x.id),x]));const ordered=(r.data||[]).map(x=>byId.get(String(x.question_id))).filter(Boolean);const groups={};ordered.forEach(x=>(groups[cat(x.category)]??=[]).push(x));let n=0;let html='<h1>'+esc(j.data.title)+'</h1><p>মোট প্রশ্ন: '+ordered.length+'</p>';for(const [c,arr] of Object.entries(groups)){html+='<section class="cat"><h2>'+esc(c)+' — '+arr.length+'টি প্রশ্ন</h2>';for(const x of arr){n++;html+='<div class="q"><b>'+n+'. '+esc(x.question||x.question_text||"")+'</b><div>ক) '+esc(x.option_a)+'</div><div>খ) '+esc(x.option_b)+'</div><div>গ) '+esc(x.option_c)+'</div><div>ঘ) '+esc(x.option_d)+'</div><div class="ans">সঠিক উত্তর: '+esc(L[x.correct_answer||x.correct_option]||x.correct_answer||x.correct_option||"")+'</div>'+(x.explanation?'<div class="exp"><b>ব্যাখ্যা:</b><br>'+esc(x.explanation)+'</div>':'')+'</div>'}html+='</section>'}app.innerHTML=html}go();</script></body></html>
