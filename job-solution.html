<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Solution</title><link rel="stylesheet" href="css/common.css"></head><body><div class="wrap"><div class="card"><h1 id="title">Job Solution</h1></div><div id="list"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/common.js"></script><script>async function init(){const id=new URLSearchParams(location.search).get("job");if(!id)return;const j=await db.from("job_solutions").select("*").eq("id",id).single();if(j.error)return;$("title").textContent=j.data.title;const r=await db.from("job_solution_questions").select("question_order,questions(*)").eq("job_solution_id",id).order("question_order");$("list").innerHTML=(r.data||[]).map((x,i)=>{const q=x.questions;return `<div class="card"><b>${bn(i+1)}. ${safe(q.question_text)}</b><p>ক) ${safe(q.option_a)}</p><p>খ) ${safe(q.option_b)}</p><p>গ) ${safe(q.option_c)}</p><p>ঘ) ${safe(q.option_d)}</p><p><b>সঠিক উত্তর:</b> ${safe(answerBn(q.correct_option))}</p>${q.explanation?`<p><b>ব্যাখ্যা:</b> ${safe(q.explanation)}</p>`:''}</div>`}).join("")||'<div class="msg">কোনো প্রশ্ন নেই।</div>'}init();</script></body></html>
