<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Solution</title><style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f6f8;margin:0}.wrap{max-width:900px;margin:auto;padding:12px}.card{background:#fff;padding:16px;margin:10px 0;border-radius:12px}.q{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:9px}.chip{display:inline-block;background:#eef3f7;padding:4px 8px;border-radius:20px;margin:2px;font-size:12px}.ans{font-weight:bold}.exp{background:#f5f5f5;padding:8px;margin-top:6px}</style></head><body><div class="wrap"><div id="app" class="card">লোড হচ্ছে...</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");const id=new URLSearchParams(location.search).get("job");const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const L={A:"ক",B:"খ",C:"গ",D:"ঘ"};async function go(){if(!id)return app.innerHTML="Job Solution ID পাওয়া যায়নি।";let j=await db.from("job_solutions").select("*").eq("id",id).single();if(j.error)return app.innerHTML="Job Solution পাওয়া যায়নি।";let r=await db.from("job_solution_questions").select("question_id").eq("job_solution_id",id);let ids=(r.data||[]).map(x=>x.question_id);let q=ids.length?await db.from("questions").select("*").in("id",ids):{data:[],error:null};if(q.error)return app.innerHTML=q.error.message;let arr=q.data||[];app.innerHTML='<h1>'+esc(j.data.title)+'</h1><p>মোট প্রশ্ন: '+arr.length+'</p>'+arr.map((x,i)=>'<div class="q"><span class="chip">'+esc(x.category||"")+'</span><b>'+ (i+1)+'. '+esc(x.question||x.question_text||"")+'</b><div>ক) '+esc(x.option_a)+'</div><div>খ) '+esc(x.option_b)+'</div><div>গ) '+esc(x.option_c)+'</div><div>ঘ) '+esc(x.option_d)+'</div><div class="ans">সঠিক উত্তর: '+esc(L[x.correct_answer||x.correct_option]||x.correct_answer||x.correct_option||"")+'</div>'+(x.explanation?'<div class="exp"><b>ব্যাখ্যা:</b> '+esc(x.explanation)+'</div>':'')+'</div>').join("")}go();</script></body></html>
